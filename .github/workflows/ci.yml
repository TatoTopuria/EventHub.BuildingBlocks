name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: '8.0.x'
  DOTNET_NOLOGO: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: ${{ runner.os }}-nuget-
      # No test project — the kernel's behavior is exercised by the service repos' suites.
      - name: Build
        run: dotnet build BuildingBlocks.slnx --configuration Release

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Pack
        run: dotnet pack src/EventHub.BuildingBlocks/EventHub.BuildingBlocks.csproj -c Release -o ./artifacts
      # Requires repo variable EVENTHUB_NUGET_FEED + secret NUGET_FEED_API_KEY (the durable feed).
      - name: Push to feed
        run: >-
          dotnet nuget push "./artifacts/*.nupkg"
          --source "${{ vars.EVENTHUB_NUGET_FEED }}"
          --api-key "${{ secrets.NUGET_FEED_API_KEY }}"
          --skip-duplicate
